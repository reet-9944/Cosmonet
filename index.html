<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>COSMONET - The Universe Explorer</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        overflow-x: hidden;
        font-size: 16px;
      }
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        min-width: 320px;
      }
      /* Prevent horizontal scroll on zoom */
      #root {
        max-width: 100vw;
        overflow-x: hidden;
      }
      /* Responsive images */
      img {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.tailwindcss.com"></script>
  </body>
</html>
